<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Trackmaster login</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
           font: 16px system-ui, sans-serif; color: #fff; text-align: center;
           background: linear-gradient(135deg, #6A3BD1, #22104A); padding: 24px; box-sizing: border-box; }
  </style>
</head>
<body>
  <p>Login complete. You can close this window if it doesn't close by itself.</p>
  <script>
    // From the flutter_web_auth_2 README: hands the Spotify redirect (with the
    // one-time code) back to the app, and only to the app's own origin.
    (function () {
      const message = { 'flutter-web-auth-2': window.location.href };
      if (window.opener) {
        window.opener.postMessage(message, window.location.origin);
        window.close();
      } else if (window.parent && window.parent !== window) {
        window.parent.postMessage(message, window.location.origin);
      } else {
        localStorage.setItem('flutter-web-auth-2', window.location.href);
        window.close();
      }
    })();
  </script>
</body>
</html>
